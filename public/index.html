`<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheily ToDo VPS</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="container">
    <h1>📝 Sheily ToDo VPS</h1>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Escribe una tarea">
      <button onclick="addTask()">Agregar</button>
    </div>

    <input type="text" id="search" placeholder="🔍 Filtrar tareas...">

    <div class="stats">
      <span id="total">0 tareas</span>
    </div>

    <ul id="taskList"></ul>
  </div>

  <!-- JavaScript -->
  <script src="/script.js"></script>
</body>
</html>`
