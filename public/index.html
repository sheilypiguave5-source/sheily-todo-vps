<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sheily's To-Do List</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  li { display: flex; justify-content: space-between; padding: 6px 0; }
  li.done span { text-decoration: line-through; color: #999; }
  input[type=text] { padding: 6px; width: 70%; }
  button { cursor: pointer; }
</style>
</head>
<body>
  <h1>Sheily's To-Do List</h1>
  <input id="newTask" type="text" placeholder="Nueva tarea...">
  <button onclick="addTask()">Agregar</button>
  <br><br>
  <input id="filter" type="text" placeholder="Filtrar tareas..." oninput="renderTasks()">
  <ul id="list"></ul>
  <script src="app.js"></script>
</body>
</html>
